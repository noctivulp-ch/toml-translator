# Enrutado para NITO (Pixel Game Maker MV, japonés → español latino).
#
# POR QUÉ NO HAY translategemma AQUÍ
# ──────────────────────────────────
# Se intentó usarlo para el texto neutro y falló de una forma que no se ve en los
# benchmarks: TranslateGemma es un modelo de traducción pura y NO sigue
# instrucciones — al recibir el prompt con reglas y etiquetas de idioma, tradujo
# las propias reglas al español y devolvió las líneas japonesas intactas.
# Resultado: 41 de 124 textos sin traducir, más romaji inventado.
#
# Es el ADR 0007 llevado al extremo: cuanto más se aleja el prompt de la forma
# entrenada, peor. Con lista numerada + reglas + refs, se rompe del todo.
#
# Para este juego todo va a un modelo instruct fiel. Son 124 textos: el ahorro de
# velocidad no compensaba el riesgo.

[[route]]
name   = "todo"
model  = "Librellama/gemma4:e2b-Uncensored"
prompt = "../../prompts/japones-es.toml"
batch  = 12

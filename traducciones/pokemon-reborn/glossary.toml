# Jerga y nombres para los diálogos de TERRA (Pokémon Reborn, castellano).
#
# Existe porque el system prompt pedía "no censures" y "usa jerga de España" y el
# modelo cumplía a medias: 33% en tacos y 0% en registro. Una instrucción general
# se diluye; un par origen→destino concreto no.

# ── Nombres propios: NO se traducen ──────────────────────────────────────────
[[term]]
source = "Ciel"
target = "Ciel"
note   = "personaje — nunca 'cielo'"

[[term]]
source = "Terra"
target = "TERRA"

[[term]]
source = "Anna"
target = "Anna"

[[term]]
source = "Titania"
target = "Titania"

